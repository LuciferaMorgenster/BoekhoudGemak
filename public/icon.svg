<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with smooth squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" />
  
  <!-- Financial bar chart elements forming the letter 'B' -->
  <g transform="translate(100, 96)">
    <!-- Main spine bar -->
    <rect x="24" y="24" width="56" height="272" rx="28" fill="url(#emeraldGrad)" />
    
    <!-- Top arc / bar -->
    <path d="M 60,32 H 180 C 230,32 260,65 260,105 C 260,145 230,175 180,175 H 60" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Bottom arc / bar (larger) -->
    <path d="M 60,175 H 195 C 255,175 288,210 288,255 C 288,300 250,332 195,332 H 60" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward financial trend arrow / accent dot -->
    <circle cx="205" cy="105" r="14" fill="#6ee7b7" filter="url(#glow)" />
    <circle cx="218" cy="255" r="16" fill="#6ee7b7" filter="url(#glow)" />
  </g>
</svg>
